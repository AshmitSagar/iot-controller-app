version: '3.8'

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    privileged: true
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    volumes:
      - ./ha-config:/config
    ports:
      - "8123:8123"
    networks:
      - iot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  iot-controller:
    build:
      context: ./iot-controller
      dockerfile: Dockerfile
    container_name: iot-controller-app
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - HA_URL=http://homeassistant:8123
    depends_on:
      homeassistant:
        condition: service_healthy
    networks:
      - iot-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  iot-network:
    driver: bridge
