<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 space-y-8">
    <!-- Header -->
    <div>
      <h2 class="text-center text-3xl font-extrabold text-gray-900 dark:text-white">
        IoT Controller
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600 dark:text-gray-400">
        Connect to your Home Assistant instance
      </p>
    </div>

    <!-- Login Form -->
    <form class="space-y-6" (ngSubmit)="onLogin()">
      <div class="space-y-4">
        <!-- Home Assistant URL Input -->
        <div>
          <label for="hassUrl" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
            Home Assistant URL
          </label>
          <input
            id="hassUrl"
            name="hassUrl"
            type="text"
            required
            [(ngModel)]="hassUrl"
            class="appearance-none relative block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 placeholder-gray-500 dark:placeholder-gray-400 text-gray-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 focus:z-10 sm:text-sm"
            placeholder="http://localhost:8123"
          />
        </div>

        <!-- Access Token Input -->
        <div>
          <label for="accessToken" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
            Long-Lived Access Token
          </label>
          <input
            id="accessToken"
            name="accessToken"
            type="password"
            required
            [(ngModel)]="accessToken"
            class="appearance-none relative block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 placeholder-gray-500 dark:placeholder-gray-400 text-gray-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 focus:z-10 sm:text-sm"
            placeholder="Enter your access token"
          />
          <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">
            Generate in Home Assistant: Profile → Security → Long-Lived Access Tokens
          </p>
        </div>
      </div>

      <!-- Error Message -->
      @if (error()) {
        <div class="rounded-md bg-red-50 dark:bg-red-900/20 p-4">
          <div class="flex">
            <div class="flex-shrink-0">
              <svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
              </svg>
            </div>
            <div class="ml-3">
              <p class="text-sm font-medium text-red-800 dark:text-red-200">
                {{ error() }}
              </p>
            </div>
          </div>
        </div>
      }

      <!-- Submit Button -->
      <div>
        <button
          type="submit"
          [disabled]="!isFormValid() || loading()"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200"
        >
          @if (loading()) {
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Connecting...
          } @else {
            Connect to Home Assistant
          }
        </button>
      </div>
    </form>
  </div>
</div>
